    <text x="200" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">A</text>
    <!-- Tab B -->
    <rect x="252" y="108" width="96" height="80" rx="6" fill="#262626" stroke="#4A4A4A" stroke-width="2"/>
    <text x="300" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">B</text>
    <!-- Z -->
    <path fill="url(#zFill)" stroke="#8E949C" stroke-width="3" stroke-linejoin="round"
